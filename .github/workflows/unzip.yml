name: Unzip Pawn Compiler

on:
  push:
    paths:
      - 'SAMP-AML-Mod.zip'
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    # تأكد من أن التنسيق (المسافات) مطابق تماماً لما يلي
    permissions:
      contents: write
      actions: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # استخدام التوكن الافتراضي لضمان وجود الصلاحيات
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip SAMP-AML-Mod.zip
        run: |
          unzip -o SAMP-AML-Mod.zip -d .

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-unzip SAMP-AML-Mod.zip content"
          file_pattern: '*'
